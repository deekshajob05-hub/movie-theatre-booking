<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineBook Booking Confirmed</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="nav">
    <a class="brand" href="index.html">CineBook</a>
  </header>
  <main class="container">
    <h1 id="heading">Loading...</h1>
    <p id="note" class="meta"></p>
    <div class="ticket">
      <h3 id="tmovie"></h3>
      <p id="ttheatre" class="meta"></p>
      <p id="ttime" class="meta"></p>
      <p id="tseats"></p>
      <p id="ttotal" class="rating"></p>
      <p id="tid" class="meta"></p>
    </div>
    <div class="row">
      <a class="btn" href="mybookings.html">My Bookings</a>
      <button class="btn" onclick="window.print()">Print ticket</button>
      <a class="btn" href="index.html">Book more</a>
    </div>
  </main>
  <script src="nav.js"></script>
  <script src="confirmation.js"></script>
</body>
</html>
